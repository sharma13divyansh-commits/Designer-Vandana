<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" height="100%">
  <defs>
    <linearGradient id="certBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="cShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Certificate Canvas -->
  <rect width="600" height="420" rx="16" fill="url(#certBg)" filter="url(#cShadow)" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Ornate Certificate Borders -->
  <rect x="18" y="18" width="564" height="384" rx="10" fill="none" stroke="url(#goldBorder)" stroke-width="3"/>
  <rect x="25" y="25" width="550" height="370" rx="6" fill="none" stroke="#0f172a" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Certificate Corner Ornaments -->
  <g fill="url(#goldBorder)">
    <polygon points="18,18 45,18 18,45"/>
    <polygon points="582,18 555,18 582,45"/>
    <polygon points="18,402 45,402 18,375"/>
    <polygon points="582,402 555,402 582,375"/>
  </g>

  <!-- Seal Emblem -->
  <g transform="translate(100, 110)">
    <!-- Starburst Ribbon / Seal -->
    <circle cx="0" cy="0" r="48" fill="#d4af37" opacity="0.2"/>
    <circle cx="0" cy="0" r="42" fill="none" stroke="url(#goldBorder)" stroke-width="3"/>
    <circle cx="0" cy="0" r="36" fill="#0f172a"/>
    <text x="0" y="-8" text-anchor="middle" font-family="'Poppins', sans-serif" font-weight="800" font-size="14" fill="#fbbf24">ISO</text>
    <text x="0" y="8" text-anchor="middle" font-family="'Poppins', sans-serif" font-weight="700" font-size="10" fill="#ffffff">CERTIFIED</text>
    <text x="0" y="20" text-anchor="middle" font-family="'Inter', sans-serif" font-size="7" fill="#fbbf24">INSTITUTE</text>
  </g>

  <!-- Certificate Content -->
  <text x="350" y="75" text-anchor="middle" font-family="'Poppins', sans-serif" font-weight="700" font-size="14" fill="#d97706" letter-spacing="4">CERTIFICATION OF RECOGNITION</text>
  <text x="350" y="108" text-anchor="middle" font-family="'Poppins', sans-serif" font-weight="800" font-size="22" fill="#0f172a">ISO CERTIFIED INSTITUTE</text>
  <line x1="220" y1="125" x2="480" y2="125" stroke="url(#goldBorder)" stroke-width="2"/>

  <text x="350" y="160" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" fill="#475569">This is to proudly certify that</text>
  <text x="350" y="195" text-anchor="middle" font-family="'Poppins', sans-serif" font-weight="700" font-size="18" fill="#1e3a8a">Designer Vandana Learning Studio</text>
  
  <text x="350" y="228" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" fill="#475569">has been assessed and certified for maintaining exemplary quality standards</text>
  <text x="350" y="248" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" fill="#475569">in Computer Training, Multimedia &amp; Graphic Design Education.</text>

  <!-- Details Table Box -->
  <rect x="180" y="270" width="340" height="45" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="200" y="297" font-family="'Inter', sans-serif" font-weight="600" font-size="10" fill="#0f172a">Quality Management Standard</text>
  <text x="440" y="297" font-family="'Inter', sans-serif" font-weight="700" font-size="10" fill="#059669">Verified &amp; Compliant</text>

  <!-- Signatures Line -->
  <line x1="180" y1="365" x2="300" y2="365" stroke="#94a3b8" stroke-width="1"/>
  <text x="240" y="380" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" fill="#64748b">Quality Assurance</text>

  <line x1="400" y1="365" x2="520" y2="365" stroke="#94a3b8" stroke-width="1"/>
  <text x="460" y="380" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" fill="#64748b">Authorized Director</text>
</svg>