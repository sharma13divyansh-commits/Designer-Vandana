<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 480" width="100%" height="100%">
  <defs>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="warmLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="650" height="480" fill="url(#wallGrad)" rx="20"/>

  <!-- Overhead Studio Lighting Beams -->
  <polygon points="120,0 200,0 260,250 80,250" fill="url(#warmLight)"/>
  <polygon points="450,0 530,0 590,250 410,250" fill="url(#warmLight)"/>

  <!-- Big Studio Presentation Smart Board -->
  <rect x="140" y="35" width="370" height="180" rx="10" fill="#020617" stroke="#334155" stroke-width="3"/>
  <rect x="150" y="45" width="350" height="160" rx="6" fill="#0f172a"/>
  
  <!-- Presentation Screen Content -->
  <text x="325" y="80" text-anchor="middle" font-family="'Poppins', sans-serif" font-weight="700" font-size="16" fill="#38bdf8">DESIGNER VANDANA LEARNING STUDIO</text>
  <text x="325" y="105" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8">Interactive Project-Based Computer Training</text>
  
  <!-- Mini Bar Chart on Board -->
  <g transform="translate(190, 120)">
    <rect x="0" y="40" width="22" height="30" rx="3" fill="#3b82f6"/>
    <rect x="35" y="25" width="22" height="45" rx="3" fill="#6366f1"/>
    <rect x="70" y="10" width="22" height="60" rx="3" fill="#8b5cf6"/>
    <rect x="105" y="0" width="22" height="70" rx="3" fill="#10b981"/>
    <rect x="140" y="-15" width="22" height="85" rx="3" fill="#f59e0b"/>
    <rect x="175" y="-25" width="22" height="95" rx="3" fill="#d4af37"/>
  </g>
  <line x1="170" y1="190" x2="480" y2="190" stroke="#334155" stroke-width="1.5"/>

  <!-- Computer Desks / Student Workstations in foreground -->
  <!-- Desk Base -->
  <rect x="50" y="280" width="550" height="15" fill="#334155" rx="3"/>
  <rect x="80" y="295" width="20" height="140" fill="#1e293b"/>
  <rect x="550" y="295" width="20" height="140" fill="#1e293b"/>

  <!-- Workstation 1 (Left) -->
  <g transform="translate(110, 200)">
    <rect width="110" height="80" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <rect x="5" y="5" width="100" height="70" rx="3" fill="#0284c7"/>
    <circle cx="55" cy="40" r="18" fill="#ffffff" opacity="0.8"/>
    <text x="55" y="45" text-anchor="middle" font-family="'Poppins', sans-serif" font-weight="700" font-size="11" fill="#0284c7">Ps</text>
    <rect x="45" y="80" width="20" height="15" fill="#64748b"/>
    <rect x="30" y="93" width="50" height="4" fill="#94a3b8" rx="2"/>
  </g>

  <!-- Workstation 2 (Center) -->
  <g transform="translate(270, 195)">
    <rect width="120" height="85" rx="6" fill="#1e293b" stroke="#d4af37" stroke-width="2"/>
    <rect x="6" y="6" width="108" height="73" rx="3" fill="#0f172a"/>
    <polygon points="60,20 85,60 35,60" fill="none" stroke="#d4af37" stroke-width="2"/>
    <text x="60" y="48" text-anchor="middle" font-family="'Poppins', sans-serif" font-weight="700" font-size="12" fill="#d4af37">DV</text>
    <rect x="50" y="85" width="20" height="15" fill="#64748b"/>
    <rect x="35" y="98" width="50" height="4" fill="#94a3b8" rx="2"/>
  </g>

  <!-- Workstation 3 (Right) -->
  <g transform="translate(440, 200)">
    <rect width="110" height="80" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <rect x="5" y="5" width="100" height="70" rx="3" fill="#d97706"/>
    <text x="55" y="45" text-anchor="middle" font-family="'Poppins', sans-serif" font-weight="700" font-size="14" fill="#ffffff">Ai</text>
    <rect x="45" y="80" width="20" height="15" fill="#64748b"/>
    <rect x="30" y="93" width="50" height="4" fill="#94a3b8" rx="2"/>
  </g>

  <!-- Studio Floor Line -->
  <line x1="0" y1="435" x2="650" y2="435" stroke="#334155" stroke-width="2"/>
  <rect x="0" y="437" width="650" height="43" fill="#0b1120"/>

  <!-- Badge Overlay -->
  <g transform="translate(40, 390)">
    <rect width="180" height="38" rx="8" fill="rgba(15,23,42,0.9)" stroke="#10b981" stroke-width="1.5"/>
    <text x="90" y="24" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#34d399">✓ 100% HANDS-ON LAB</text>
  </g>
</svg>