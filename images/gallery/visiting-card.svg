<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="#0f172a"/>

  <!-- Back Card (Angled) -->
  <g transform="translate(180, 110) rotate(-8)" filter="url(#shadow)">
    <rect width="400" height="240" rx="12" fill="url(#cardBg)" stroke="rgba(251,191,36,0.3)" stroke-width="1.5"/>
    <circle cx="200" cy="120" r="50" fill="none" stroke="url(#goldAcc)" stroke-width="3"/>
    <text x="200" y="128" text-anchor="middle" font-family="'Poppins', sans-serif" font-weight="700" font-size="28" fill="url(#goldAcc)">DV</text>
    <line x1="50" y1="200" x2="350" y2="200" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  </g>

  <!-- Front Card (Hero) -->
  <g transform="translate(220, 200) rotate(4)" filter="url(#shadow)">
    <rect width="420" height="250" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    
    <!-- Accent Left Stripe -->
    <path d="M0,0 L20,0 L5,250 L0,250 Z" fill="url(#goldAcc)"/>
    
    <!-- Name & Title -->
    <text x="50" y="70" font-family="'Poppins', sans-serif" font-weight="700" font-size="22" fill="#0f172a">VANDANA SHARMA</text>
    <text x="50" y="92" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#d97706" letter-spacing="2">CREATIVE DIRECTOR &amp; EDUCATOR</text>
    
    <line x1="50" y1="115" x2="370" y2="115" stroke="#f1f5f9" stroke-width="2"/>
    
    <!-- Contact Info -->
    <g transform="translate(50, 140)" fill="#64748b" font-family="'Inter', sans-serif" font-size="11">
      <circle cx="8" cy="4" r="4" fill="#d97706"/>
      <text x="22" y="8">+91 9582315625</text>
      
      <circle cx="8" cy="30" r="4" fill="#d97706"/>
      <text x="22" y="34">contact@designervandana.com</text>
      
      <circle cx="8" cy="56" r="4" fill="#d97706"/>
      <text x="22" y="60">Paschim Vihar, New Delhi - 63</text>
    </g>

    <!-- Mini QR code representation -->
    <rect x="330" y="145" width="55" height="55" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <g fill="#0f172a">
      <rect x="337" y="152" width="12" height="12"/>
      <rect x="366" y="152" width="12" height="12"/>
      <rect x="337" y="181" width="12" height="12"/>
      <rect x="355" y="168" width="6" height="6"/>
      <rect x="366" y="181" width="8" height="8"/>
    </g>
  </g>

  <!-- Tag -->
  <rect x="30" y="30" width="160" height="34" rx="17" fill="rgba(217,119,6,0.15)" stroke="rgba(217,119,6,0.4)" stroke-width="1"/>
  <text x="110" y="52" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#fbbf24">VISITING CARD</text>
</svg>