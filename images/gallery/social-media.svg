<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="instaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="postShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="#0b1329"/>

  <!-- Phone Mockup Container -->
  <g transform="translate(225, 40)" filter="url(#postShadow)">
    <!-- Device Frame -->
    <rect width="350" height="520" rx="36" fill="#1e293b" stroke="#334155" stroke-width="4"/>
    <rect x="15" y="15" width="320" height="490" rx="26" fill="url(#instaGrad)"/>
    
    <!-- Top Notch -->
    <rect x="125" y="22" width="100" height="18" rx="9" fill="#0f172a"/>

    <!-- Social Post Content -->
    <g transform="translate(35, 70)">
      <rect width="280" height="30" rx="15" fill="rgba(255,255,255,0.2)"/>
      <circle cx="20" cy="15" r="10" fill="#ffffff"/>
      <text x="40" y="19" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#ffffff">@designervandana_learningstudio</text>
      
      <!-- Headline on post -->
      <text x="140" y="90" text-anchor="middle" font-family="'Poppins', sans-serif" font-weight="800" font-size="26" fill="#ffffff">MASTERCLASS</text>
      <text x="140" y="120" text-anchor="middle" font-family="'Poppins', sans-serif" font-weight="700" font-size="18" fill="#fde047">UI/UX &amp; GRAPHIC DESIGN</text>
      
      <!-- Vector artwork inside post -->
      <circle cx="140" cy="220" r="70" fill="rgba(255,255,255,0.15)"/>
      <polygon points="140,165 190,245 90,245" fill="#ffffff" opacity="0.9"/>
      <circle cx="140" cy="215" r="25" fill="#fbbf24"/>
      
      <rect x="30" y="310" width="220" height="45" rx="22" fill="#ffffff"/>
      <text x="140" y="338" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="700" font-size="14" fill="#4f46e5">ENROLL NOW - 50% OFF</text>

      <text x="140" y="380" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" fill="#f1f5f9">ONLINE &amp; OFFLINE BATCHES STARTING</text>
    </g>
  </g>

  <!-- Tag -->
  <rect x="30" y="30" width="190" height="34" rx="17" fill="rgba(236,72,153,0.15)" stroke="rgba(236,72,153,0.4)" stroke-width="1"/>
  <text x="125" y="52" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#f472b6">SOCIAL MEDIA CREATIVE</text>
</svg>