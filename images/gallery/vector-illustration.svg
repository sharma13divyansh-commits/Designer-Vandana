<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="sunsetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdba74" />
      <stop offset="40%" stop-color="#f43f5e" />
      <stop offset="70%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#sunsetGrad)"/>

  <!-- Retro Sun -->
  <circle cx="400" cy="300" r="140" fill="#fef08a" opacity="0.9"/>
  <!-- Sun slices -->
  <line x1="260" y1="280" x2="540" y2="280" stroke="#f43f5e" stroke-width="4"/>
  <line x1="265" y1="305" x2="535" y2="305" stroke="#f43f5e" stroke-width="7"/>
  <line x1="275" y1="335" x2="525" y2="335" stroke="#f43f5e" stroke-width="11"/>
  <line x1="295" y1="370" x2="505" y2="370" stroke="#f43f5e" stroke-width="15"/>

  <!-- Mountain Silhouettes -->
  <polygon points="0,480 180,310 320,440" fill="#312e81"/>
  <polygon points="260,450 480,260 680,480" fill="#1e1b4b"/>
  <polygon points="560,460 700,340 800,430" fill="#312e81"/>

  <!-- Futuristic Perspective Grid / Cyber Highway -->
  <g stroke="#06b6d4" stroke-width="1.5" opacity="0.75">
    <line x1="400" y1="420" x2="0" y2="600"/>
    <line x1="400" y1="420" x2="160" y2="600"/>
    <line x1="400" y1="420" x2="320" y2="600"/>
    <line x1="400" y1="420" x2="480" y2="600"/>
    <line x1="400" y1="420" x2="640" y2="600"/>
    <line x1="400" y1="420" x2="800" y2="600"/>

    <line x1="330" y1="450" x2="470" y2="450"/>
    <line x1="260" y1="480" x2="540" y2="480"/>
    <line x1="180" y1="520" x2="620" y2="520"/>
    <line x1="80" y1="565" x2="720" y2="565"/>
  </g>

  <!-- Tag -->
  <rect x="30" y="30" width="180" height="34" rx="17" fill="rgba(139,92,246,0.2)" stroke="rgba(139,92,246,0.5)" stroke-width="1"/>
  <text x="120" y="52" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#c4b5fd">VECTOR ILLUSTRATION</text>
</svg>