<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Pattern -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="600" />
    <line x1="200" y1="0" x2="200" y2="600" />
    <line x1="300" y1="0" x2="300" y2="600" />
    <line x1="400" y1="0" x2="400" y2="600" />
    <line x1="500" y1="0" x2="500" y2="600" />
    <line x1="600" y1="0" x2="600" y2="600" />
    <line x1="700" y1="0" x2="700" y2="600" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="450" x2="800" y2="450" />
  </g>

  <!-- Circular background badge -->
  <circle cx="400" cy="270" r="160" fill="none" stroke="rgba(212,175,55,0.15)" stroke-width="2" stroke-dasharray="6,6"/>
  <circle cx="400" cy="270" r="130" fill="none" stroke="rgba(212,175,55,0.25)" stroke-width="1.5"/>

  <!-- Geometric Luxury Logo Emblem -->
  <g transform="translate(400,270)">
    <!-- Outer Triangle -->
    <polygon points="0,-100 86,50 -86,50" fill="none" stroke="url(#goldGrad)" stroke-width="10" stroke-linejoin="round" filter="url(#glow)"/>
    <!-- Intertwined DV Monogram -->
    <path d="M -45,-30 L -15,-30 C 5,-30 18,-15 18,5 C 18,25 5,40 -15,40 L -45,40 Z" fill="none" stroke="url(#goldGrad)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 0,-30 L 25,35 L 50,-30" fill="none" stroke="url(#goldGrad)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Typography -->
  <text x="400" y="470" text-anchor="middle" font-family="'Poppins', sans-serif" font-weight="700" font-size="28" fill="#ffffff" letter-spacing="4">AURORA LUXURY JEWELS</text>
  <text x="400" y="505" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="400" font-size="14" fill="#94a3b8" letter-spacing="6">BRAND IDENTITY &amp; MONOGRAM SUITE</text>
  
  <!-- Student Project Badge -->
  <rect x="30" y="30" width="160" height="34" rx="17" fill="rgba(212,175,55,0.15)" stroke="rgba(212,175,55,0.4)" stroke-width="1"/>
  <text x="110" y="52" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#fde047">LOGO DESIGN</text>
</svg>