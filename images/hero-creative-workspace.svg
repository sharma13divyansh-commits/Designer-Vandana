<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 550" width="100%" height="100%">
  <defs>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#141c2e" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="deskGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
    </filter>
    <filter id="floatShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="350" cy="220" r="220" fill="#2563eb" opacity="0.15" filter="url(#deskGlow)"/>
  <circle cx="480" cy="300" r="150" fill="#f59e0b" opacity="0.12" filter="url(#deskGlow)"/>

  <!-- Main iMac / Display Monitor -->
  <g transform="translate(100, 40)" filter="url(#floatShadow)">
    <!-- Monitor Bezel -->
    <rect width="500" height="320" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <rect x="12" y="12" width="476" height="296" rx="8" fill="url(#screenGrad)"/>
    
    <!-- Monitor Stand -->
    <path d="M 220,320 L 210,400 L 290,400 L 280,320 Z" fill="#64748b"/>
    <ellipse cx="250" cy="400" rx="75" ry="10" fill="#475569"/>

    <!-- Screen UI Elements (Design Software Interface) -->
    <!-- App Toolbar -->
    <rect x="12" y="12" width="476" height="24" fill="#0f172a"/>
    <circle cx="26" cy="24" r="4" fill="#ef4444"/>
    <circle cx="38" cy="24" r="4" fill="#f59e0b"/>
    <circle cx="50" cy="24" r="4" fill="#10b981"/>
    <text x="70" y="27" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">DesignerVandana_MasterSuite.ai</text>

    <!-- Left Tool Panel -->
    <rect x="12" y="36" width="34" height="272" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <g fill="#94a3b8" transform="translate(18, 48)">
      <!-- Selection tool -->
      <polygon points="4,2 14,10 9,11 13,18 10,19 6,12 2,15"/>
      <!-- Pen tool -->
      <path d="M 4,32 L 14,24 L 18,28 L 8,38 L 4,40 Z M 13,29 L 9,33"/>
      <!-- Brush -->
      <rect x="5" y="55" width="10" height="10" rx="2"/>
      <!-- Text T -->
      <text x="5" y="85" font-family="'Inter', sans-serif" font-weight="700" font-size="12">T</text>
      <!-- Shapes -->
      <circle cx="10" cy="105" r="5" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
      <rect x="5" y="125" width="10" height="10" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    </g>

    <!-- Artboard Canvas in Monitor -->
    <rect x="60" y="46" width="310" height="240" fill="#ffffff" rx="4"/>
    
    <!-- Design Artwork on Canvas: 3D geometric composition -->
    <g transform="translate(75, 55)">
      <!-- Gradient Sphere -->
      <circle cx="140" cy="110" r="60" fill="url(#accentGrad)"/>
      <ellipse cx="140" cy="110" rx="80" ry="25" fill="none" stroke="#d4af37" stroke-width="3" transform="rotate(-20 140 110)"/>
      
      <!-- Pen Tool Bezier Curve with Anchors -->
      <path d="M 40,160 C 80,60 200,60 240,160" fill="none" stroke="#0284c7" stroke-width="3"/>
      <!-- Anchor points -->
      <rect x="36" y="156" width="8" height="8" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
      <rect x="236" y="156" width="8" height="8" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
      <circle cx="140" cy="85" r="4" fill="#0284c7"/>
      <!-- Control handle lines -->
      <line x1="140" y1="85" x2="80" y2="60" stroke="#38bdf8" stroke-dasharray="2,2"/>
      <line x1="140" y1="85" x2="200" y2="60" stroke="#38bdf8" stroke-dasharray="2,2"/>
      <circle cx="80" cy="60" r="3" fill="#38bdf8"/>
      <circle cx="200" cy="60" r="3" fill="#38bdf8"/>

      <text x="140" y="210" text-anchor="middle" font-family="'Poppins', sans-serif" font-weight="700" font-size="14" fill="#0f172a">CREATIVE DESIGN MASTER</text>
    </g>

    <!-- Right Properties / Layers Panel -->
    <rect x="380" y="36" width="108" height="272" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <g transform="translate(390, 48)">
      <text x="0" y="12" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#e2e8f0">LAYERS</text>
      <!-- Layer rows -->
      <rect x="0" y="20" width="88" height="20" rx="3" fill="#1e293b"/>
      <text x="6" y="34" font-family="'Inter', sans-serif" font-size="8" fill="#93c5fd">👁 Monogram Vector</text>
      
      <rect x="0" y="44" width="88" height="20" rx="3" fill="#0f172a"/>
      <text x="6" y="58" font-family="'Inter', sans-serif" font-size="8" fill="#94a3b8">👁 Gradient Mesh</text>

      <rect x="0" y="68" width="88" height="20" rx="3" fill="#0f172a"/>
      <text x="6" y="82" font-family="'Inter', sans-serif" font-size="8" fill="#94a3b8">👁 Gold Bezier Orbit</text>

      <!-- Color Swatches -->
      <text x="0" y="112" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#e2e8f0">SWATCHES</text>
      <circle cx="8" cy="128" r="6" fill="#2563eb"/>
      <circle cx="24" cy="128" r="6" fill="#7c3aed"/>
      <circle cx="40" cy="128" r="6" fill="#f59e0b"/>
      <circle cx="56" cy="128" r="6" fill="#10b981"/>
      <circle cx="72" cy="128" r="6" fill="#ef4444"/>

      <!-- Video timeline mini preview -->
      <text x="0" y="160" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#e2e8f0">TIMELINE 4K</text>
      <rect x="0" y="168" width="88" height="14" rx="2" fill="#2563eb"/>
      <rect x="0" y="186" width="88" height="14" rx="2" fill="#10b981"/>
    </g>
  </g>

  <!-- Floating Creative Software Badges around monitor -->
  <!-- Photoshop Ps Badge -->
  <g transform="translate(50, 160)" filter="url(#floatShadow)">
    <rect width="65" height="65" rx="14" fill="#001e36" stroke="#31a8ff" stroke-width="2"/>
    <text x="32" y="44" text-anchor="middle" font-family="'Poppins', sans-serif" font-weight="800" font-size="28" fill="#31a8ff">Ps</text>
  </g>

  <!-- Illustrator Ai Badge -->
  <g transform="translate(570, 120)" filter="url(#floatShadow)">
    <rect width="65" height="65" rx="14" fill="#330000" stroke="#ff9a00" stroke-width="2"/>
    <text x="32" y="44" text-anchor="middle" font-family="'Poppins', sans-serif" font-weight="800" font-size="28" fill="#ff9a00">Ai</text>
  </g>

  <!-- Premiere Pro Pr Badge -->
  <g transform="translate(585, 270)" filter="url(#floatShadow)">
    <rect width="65" height="65" rx="14" fill="#00005b" stroke="#9999ff" stroke-width="2"/>
    <text x="32" y="44" text-anchor="middle" font-family="'Poppins', sans-serif" font-weight="800" font-size="28" fill="#9999ff">Pr</text>
  </g>

  <!-- CorelDRAW Cdr Badge -->
  <g transform="translate(35, 310)" filter="url(#floatShadow)">
    <rect width="65" height="65" rx="14" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
    <text x="32" y="44" text-anchor="middle" font-family="'Poppins', sans-serif" font-weight="800" font-size="24" fill="#10b981">Cdr</text>
  </g>

  <!-- Floating Golden Trust Pill -->
  <g transform="translate(230, 430)" filter="url(#floatShadow)">
    <rect width="240" height="48" rx="24" fill="#0f172a" stroke="#d4af37" stroke-width="1.5"/>
    <circle cx="28" cy="24" r="14" fill="#d4af37"/>
    <text x="28" y="29" text-anchor="middle" font-size="14">⭐</text>
    <text x="52" y="24" font-family="'Poppins', sans-serif" font-weight="700" font-size="12" fill="#ffffff">ISO &amp; MSME REGISTERED</text>
    <text x="52" y="38" font-family="'Inter', sans-serif" font-size="10" fill="#d4af37">100% Practical Training</text>
  </g>
</svg>